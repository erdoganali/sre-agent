{{- range $name, $json := .Values.dashboards }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: sre-agent
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  annotations:
    grafana_folder: {{ $.Values.folder | quote }}
data:
  {{ $name }}.json: |
    {{- $json | nindent 4 }}
{{- end }}
