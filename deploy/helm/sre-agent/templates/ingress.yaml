{{- if .Values.ingress.enabled }}
# Raporlar (/reports/{id}.md) dışarıdan; Grafana anotasyonundaki bağlantı buraya gider.
# Raporlar cluster bilgisi ve kırpılmış log satırları içerir: basic auth varsayılan açık.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/part-of: sre-agent
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    {{- with .Values.ingress.basicAuthSecret }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ . }}
    nginx.ingress.kubernetes.io/auth-realm: "sre-agent"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- range list "/reports" "/incidents" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service: {name: {{ $.Release.Name }}, port: {name: http}}
          {{- end }}
{{- end }}
