[project]
name = "sre-agent"
version = "0.1.0"
description = "Çok ajanlı, read-only SRE agent"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.2",
    "lightkube>=1.0.1",
    "mcp>=1.20",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pymilvus[milvus-lite]>=2.6",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sre_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "packs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Türkçe metinler için
allowed-confusables = ["ı", "İ"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src:tests"

[[tool.mypy.overrides]]
module = ["pymilvus", "pymilvus.*"]  # tip bilgisi yayınlamıyor
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "packs"]
pythonpath = ["tests"]
addopts = "-q -m 'not integration and not db'"
asyncio_mode = "auto"
markers = [
    "integration: GKE'ye karşı read-only entegrasyon testleri (make test-integration)",
    "db: yerel docker Postgres'e karşı testler (make test-db)",
]
