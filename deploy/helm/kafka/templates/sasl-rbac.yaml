{{- if .Values.saslPlain.enabled }}
# Broker'ın PLAIN kullanıcı Secret'ını strimzisecrets config provider'ıyla okuyabilmesi için.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.clusterName }}-kafka-sasl-users
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.saslPlain.usersSecret | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.clusterName }}-kafka-sasl-users
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.clusterName }}-kafka-sasl-users
subjects:
  - kind: ServiceAccount
    name: {{ .Values.clusterName }}-kafka
    namespace: {{ .Release.Namespace }}
{{- end }}
