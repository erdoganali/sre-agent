image:
  repository: docker.io/library/postgres
  tag: "18.6"

# make db-secrets: postgres-password, app-password, ro-password, database-url
authSecret: postgres-auth
database: sre_agent
appUser: sre_agent
readOnlyUser: grafana_ro

storage:
  size: 10Gi
  className: ""  # boşsa cluster varsayılanı

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}

# Bağlanabilecek pod'lar (NetworkPolicy); ağ politikası uygulanmıyorsa etkisizdir.
allowFrom:
  - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: sre-agent}}
  - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
    podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}

backup:
  enabled: false
  schedule: "30 2 * * *"  # her gün 02:30 UTC
  # S3 uyumlu nesne deposu (GCS S3 API + HMAC ya da Ceph)
  endpoint: https://storage.googleapis.com
  provider: GCS  # rclone s3 provider (GCS, Ceph, ...)
  bucket: ""
  prefix: postgres
  secret: postgres-backup-s3  # access_key_id, secret_access_key (make db-backup-secret)
  rcloneImage: docker.io/rclone/rclone:1.75.1
