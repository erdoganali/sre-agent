apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "pg.labels" . | nindent 4 }}
spec:
  selector: {{- include "pg.selector" . | nindent 4 }}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "pg.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}
  replicas: 1
  selector:
    matchLabels: {{- include "pg.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "pg.labels" . | nindent 8 }}
      annotations:
        checksum/init: {{ include (print $.Template.BasePath "/init.yaml") . | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.authSecret }}, key: postgres-password}}
            - name: APP_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.authSecret }}, key: app-password}}
            - name: RO_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.authSecret }}, key: ro-password}}
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            periodSeconds: 30
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}  # PGDATA: /var/lib/postgresql/18/docker
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: init
          configMap: {name: {{ .Release.Name }}-init}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storage.className }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "pg.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "pg.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from: {{- toYaml .Values.allowFrom | nindent 8 }}
      ports:
        - {port: 5432, protocol: TCP}
